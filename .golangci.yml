version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - misspell
    - unparam
  settings:
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: indent-error-flow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
