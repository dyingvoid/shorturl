x-migrate-common: &migrate-common
  image: migrate/migrate:v4.19.1

services:
  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.27.3-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${GATEWAY_PROJECT_ROOT}:/code

  migrate:
    <<: *migrate-common
    volumes:
      - ${USER_PROJECT_ROOT}/migrations:/migrations

  clickhouse-migrate:
    <<: *migrate-common
    volumes:
      - ${ANALYTICS_PROJECT_ROOT}/migrations/clickhouse:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todo-portforwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ${USER_PROJECT_ROOT}/out/postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-url_shortener}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${URL_PROJECT_ROOT}/out/mongo_data:/data/db

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${ANALYTICS_PROJECT_ROOT}/out/clickhouse_data:/var/lib/clickhouse

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  user:
    build:
      context: .
      dockerfile: user/cmd/Dockerfile
    env_file:
      - ${USER_PROJECT_ROOT}/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "50051:50051"
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  url:
    build:
      context: .
      dockerfile: url/cmd/Dockerfile
    env_file:
      - ${URL_PROJECT_ROOT}/.env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_HOST: user
      USER_SERVICE_PORT: 50051
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "50052:50052"
      - "9101:9101"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      user:
        condition: service_started
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: analytics/cmd/Dockerfile
    env_file:
      - ${ANALYTICS_PROJECT_ROOT}/.env
    environment:
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_ADDR: clickhouse:9000
      URL_SERVICE_HOST: url
      URL_SERVICE_PORT: 50052
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "50053:50053"
      - "9103:9103"
    depends_on:
      kafka:
        condition: service_started
      clickhouse:
        condition: service_started
      url:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/cmd/Dockerfile
    env_file:
      - ${GATEWAY_PROJECT_ROOT}/.env
    environment:
      USERS_SERVICE_HOST: user
      USERS_SERVICE_PORT: 50051
      URL_SERVICE_HOST: url
      URL_SERVICE_PORT: 50052
      ANALYTICS_SERVICE_HOST: analytics
      ANALYTICS_SERVICE_PORT: 50053
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "8082:8082"
      - "9102:9102"
    depends_on:
      user:
        condition: service_started
      url:
        condition: service_started
      analytics:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ${PROJECT_ROOT}/deployments/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      user:
        condition: service_started
      url:
        condition: service_started
      analytics:
        condition: service_started
      gateway:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${PROJECT_ROOT}/deployments/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ${PROJECT_ROOT}/deployments/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ${PROJECT_ROOT}/deployments/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  code:
  clickhouse_data:
  mongo_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
